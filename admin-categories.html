<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="section">
    <div class="container">
      <div class="spread">
        <div>
          <h1>Categories</h1>
          <p class="muted mt-1">Each category decides which product types, file types and prices are accepted.</p>
        </div>
        <a class="btn btn-ghost" href="/admin-review.html">Review queue</a>
      </div>

      <p class="alert alert-bad mt-3" id="forbidden" hidden>
        Administrator access is required for this page.
      </p>

      <p class="muted small mt-3" id="status">Loading…</p>

      <div class="card mt-2">
        <table class="data-table" id="table" hidden>
          <thead>
            <tr>
              <th>Category</th><th>Types</th><th>Files</th><th>Max size</th>
              <th>Min price</th><th>Order</th><th>State</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <section class="card mt-3" id="create-card" hidden>
        <h3>New category</h3>
        <form class="form mt-2" id="create-form">
          <div class="row">
            <label class="field" style="flex:1"><span>Name</span>
              <input type="text" name="name" required minlength="3" maxlength="60">
            </label>
            <label class="field" style="flex:1"><span>Slug</span>
              <input type="text" name="slug" required pattern="[a-z0-9-]{3,60}" placeholder="minecraft-mods">
            </label>
          </div>
          <label class="field"><span>Description</span>
            <input type="text" name="description" required minlength="20" maxlength="300">
          </label>
          <label class="field"><span>Allowed product types</span>
            <select name="kinds" id="kinds" multiple size="8" required></select>
            <small>Ctrl/Cmd click to select more than one.</small>
          </label>
          <label class="field"><span>Allowed file extensions</span>
            <input type="text" name="extensions" required placeholder="zip, jar, png, yml">
          </label>
          <div class="row">
            <label class="field" style="flex:1"><span>Max file size (MB)</span>
              <input type="number" name="maxFileMb" min="1" max="2000" value="200" required>
            </label>
            <label class="field" style="flex:1"><span>Minimum price (PKR)</span>
              <input type="number" name="minPrice" min="0" step="0.01" value="100" required>
            </label>
            <label class="field" style="flex:1"><span>Sort order</span>
              <input type="number" name="sort" min="0" max="9999" value="100" required>
            </label>
          </div>
          <button class="btn btn-primary" type="submit">Create category</button>
        </form>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/admin-categories.js"></script>
</body>
</html>
