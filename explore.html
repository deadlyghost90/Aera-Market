<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/marketing.css">
  <link rel="stylesheet" href="/css/premium.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="search-hero search-hero--premium">
      <div class="container">
        <span class="eyebrow eyebrow--glow">Catalogue</span>
        <h1>Explore products</h1>
        <p class="lead" style="color:#888; margin-top:12px; max-width:560px">
          Browse the full catalogue. Use filters or search to find exactly what you need.
        </p>
        <div class="hero-search" style="margin-top:24px">
          <form id="filter-form" class="hero-search__inner" role="search">
            <input type="search" name="q" id="filter-q" placeholder="Search by keyword, tag or author…" value="">
            <select name="kind" id="filter-kind">
              <option value="">All types</option>
              <option value="template">Template</option>
              <option value="plugin">Plugin</option>
              <option value="source-code">Source Code</option>
              <option value="minecraft-resource">Minecraft Resource</option>
              <option value="game-asset">Game Asset</option>
            </select>
            <button class="btn btn-primary" type="submit">Search</button>
          </form>
        </div>
      </div>
    </section>

    <div class="sticky-filter">
      <div class="container filter-row">
        <div class="filter-left">
          <span class="results-count" id="results-count">Loading…</span>
        </div>
        <div class="filter-right">
          <select name="sort" id="filter-sort">
            <option value="created-desc">Newest first</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
          <a class="chip" href="/become-a-seller.html">Sell your work</a>
        </div>
      </div>
    </div>

    <section class="section" style="padding-top: 24px">
      <div class="container">
        <ul class="product-grid" id="results"></ul>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/explore.js"></script>
</body>
</html>
