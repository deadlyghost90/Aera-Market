<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="section">
    <div class="container">
      <div class="spread">
        <div>
          <h1>Explore</h1>
          <p class="muted mt-1">Every item here has passed automated checks and human review.</p>
        </div>
        <form class="row" id="search-form">
          <input type="search" id="search-input" placeholder="Search products, tags, authors" aria-label="Search products">
          <button class="btn" type="submit">Search</button>
        </form>
      </div>

      <div class="chips mt-3" id="filter-chips"></div>
      <p class="muted small mt-2" id="result-count"></p>
      <ul class="product-grid mt-3" id="results"></ul>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/explore.js"></script>
</body>
</html>
