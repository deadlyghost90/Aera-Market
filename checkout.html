<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="site-header">
    <a href="/index.html" class="brand">Aera Market</a>
  </header>

  <main class="container">
    <h1>Checkout</h1>

    <section id="summary" aria-live="polite">
      <p id="status" class="muted">Loading…</p>
    </section>

    <section id="actions" hidden>
      <dl class="summary-list">
        <dt>Product</dt><dd id="product-name"></dd>
        <dt>Price</dt><dd id="product-price"></dd>
        <dt>Platform fee</dt><dd id="commission-label"></dd>
      </dl>
      <button id="pay-button" type="button">Pay with Safepay</button>
      <p id="pay-note" class="muted">You will be redirected to the gateway's secure checkout.</p>
    </section>
  </main>

  <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
