<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="section">
    <div class="container narrow">
      <h1 style="font-size: 1.9rem">Checkout</h1>
      <p class="muted small mt-1">Confirm the item, then continue to the secure gateway.</p>

      <div class="card mt-3">
        <p id="status" class="muted">Loading…</p>

        <div id="actions" hidden>
          <dl class="summary-list mt-2">
            <dt>Product</dt><dd id="product-name"></dd>
            <dt>Price</dt><dd id="product-price"></dd>
            <dt>Platform fee</dt><dd id="commission-label"></dd>
          </dl>
          <div class="divider"></div>
          <button id="pay-button" class="btn btn-primary btn-block" type="button">Pay with Safepay</button>
          <p id="pay-note" class="small muted mt-2">
            You will be redirected to the gateway's secure checkout. Aera never sees your card details.
          </p>
        </div>
      </div>

      <p class="small muted mt-3"><a href="/explore.html">← Keep browsing</a></p>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
