<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Payments</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="site-header">
    <a href="/index.html" class="brand">Aera Market</a>
    <nav><a href="/admin-payments.html">Payments</a></nav>
  </header>

  <main class="container">
    <h1>Payment management</h1>
    <p id="status" class="muted">Loading…</p>

    <section id="stats" class="stat-grid" hidden></section>

    <form id="filters" class="filters" hidden>
      <label>Status
        <select name="status" id="filter-status">
          <option value="ALL">All</option>
          <option value="PAID">Paid</option>
          <option value="PENDING">Pending</option>
          <option value="FAILED">Failed</option>
          <option value="REFUND_PENDING">Refund pending</option>
          <option value="PARTIALLY_REFUNDED">Partially refunded</option>
          <option value="REFUNDED">Refunded</option>
        </select>
      </label>
      <label>Search
        <input type="search" id="filter-search" placeholder="Transaction, order, customer">
      </label>
      <button type="submit">Apply</button>
    </form>

    <table class="data-table" id="payments-table" hidden>
      <thead>
        <tr>
          <th>Date</th><th>Transaction</th><th>Customer</th><th>Product</th>
          <th>Amount</th><th>Commission</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody id="payments-body"></tbody>
    </table>

    <h2>Refund requests</h2>
    <table class="data-table" id="refunds-table" hidden>
      <thead>
        <tr><th>Date</th><th>Payment</th><th>Amount</th><th>Reason</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="refunds-body"></tbody>
    </table>
  </main>

  <script type="module" src="/js/pages/admin-payments.js"></script>
</body>
</html>
