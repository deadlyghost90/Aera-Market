<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments admin — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="section">
    <div class="container">
      <div class="spread">
        <div>
          <h1>Payments</h1>
          <p class="muted mt-1">Volume, commission, refunds and seller balances.</p>
        </div>
        <a class="btn btn-ghost" href="/admin-review.html">Review queue</a>
      </div>

      <p id="status" class="muted small mt-2">Loading…</p>
      <section id="stats" class="stat-grid mt-2" hidden></section>

      <form id="filters" class="row mt-3" hidden>
        <label class="field"><span>Status</span>
          <select name="status" id="filter-status">
            <option value="ALL">All</option>
            <option value="PAID">Paid</option>
            <option value="PENDING">Pending</option>
            <option value="FAILED">Failed</option>
            <option value="REFUND_PENDING">Refund pending</option>
            <option value="PARTIALLY_REFUNDED">Partially refunded</option>
            <option value="REFUNDED">Refunded</option>
          </select>
        </label>
        <label class="field" style="flex:1"><span>Search</span>
          <input type="search" id="filter-search" placeholder="Transaction, order, customer, product">
        </label>
        <button class="btn btn-primary" type="submit">Apply</button>
      </form>

      <div class="card mt-3">
        <table class="data-table" id="payments-table" hidden>
          <thead>
            <tr>
              <th>Date</th><th>Transaction</th><th>Customer</th><th>Product</th>
              <th>Amount</th><th>Commission</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="payments-body"></tbody>
        </table>
      </div>

      <h2 class="mt-4">Refund requests</h2>
      <div class="card mt-2">
        <table class="data-table" id="refunds-table" hidden>
          <thead>
            <tr><th>Date</th><th>Payment</th><th>Amount</th><th>Reason</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="refunds-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/admin-payments.js"></script>
</body>
</html>
