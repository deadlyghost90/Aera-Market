<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My purchases — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="section">
    <div class="container">
      <div class="spread">
        <div>
          <h1>My purchases</h1>
          <p class="muted mt-1">Every payment, its verification status and refund state.</p>
        </div>
        <a class="btn btn-ghost" href="/explore.html">Explore more</a>
      </div>

      <p id="summary" class="muted small mt-3"></p>
      <p id="status" class="muted small"></p>

      <div class="card mt-2">
        <table class="data-table" id="payments-table" hidden>
          <thead>
            <tr>
              <th>Date</th><th>Product</th><th>Amount</th><th>Status</th><th>Refunded</th><th></th>
            </tr>
          </thead>
          <tbody id="payments-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/buyer-payments.js"></script>
</body>
</html>
