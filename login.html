<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Aera Market</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="section">
    <div class="container narrow">
      <div class="card card-elevated">
        <span class="hero-eyebrow">Welcome back</span>
        <h1 class="mt-2" style="font-size: 1.9rem">Sign in</h1>
        <p class="muted small mt-1">Access your purchases, author hub and payouts.</p>

        <form id="login-form" class="form mt-3">
          <label class="field"><span>Email</span>
            <input type="email" name="email" autocomplete="email" required placeholder="you@example.com">
          </label>
          <label class="field"><span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required placeholder="Your password">
          </label>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
          <p id="form-message" class="small muted" role="status"></p>
        </form>

        <div class="divider"></div>
        <p class="small muted">New here? <a href="/register.html"><strong>Create an account</strong></a></p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/auth.js"></script>
</body>
</html>
