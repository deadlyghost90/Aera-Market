<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Aera Market</title>
  <meta name="description" content="Sign in to your Aera Market account to access purchases and author tools.">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/premium.css">
</head>
<body class="auth-page auth-page--premium">
  <main>
    <div class="auth-card glass-bright fade-up">
      <!-- Logo -->
      <div class="auth-logo auth-logo--premium fade-up">
        <span class="brand-mark brand-mark--pulse"></span>
        <span>Aera Market</span>
      </div>

      <!-- Title -->
      <h1 class="auth-title fade-up">Welcome back</h1>
      <p class="auth-subtitle fade-up">Sign in to access your purchases, author hub and payouts.</p>

      <!-- Social auth row -->
      <div class="social-row social-row--premium fade-up" id="social-row">
        <button class="social-btn google" type="button" id="btn-google" title="Sign in with Google">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </button>
        <button class="social-btn apple" type="button" id="btn-apple" title="Continue with Apple">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
        </button>
        <button class="social-btn github" type="button" id="btn-github" title="Sign in with GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </button>
      </div>

      <!-- Divider -->
      <div class="auth-divider fade-up">or sign in with email</div>

      <!-- Email/Password form -->
      <form id="login-form" class="form form--premium fade-up" novalidate>
        <div class="auth-field">
          <input type="email" name="email" autocomplete="email" required placeholder="Email address" inputmode="email">
          <label>Email address</label>
        </div>
        <div class="auth-field">
          <div class="password-wrap">
            <input type="password" name="password" autocomplete="current-password" required placeholder="Password" minlength="1">
            <label>Password</label>
            <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility" tabindex="-1">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="auth-submit auth-submit--premium" type="submit" id="login-btn">
          <span class="spinner"></span>
          <span class="btn-text">Sign in</span>
        </button>
        <p id="form-message" class="auth-message" role="status"></p>
      </form>

      <!-- Footer link -->
      <p class="auth-footer fade-up">
        New here? <a href="/register.html">Create an account</a>
      </p>
    </div>
  </main>

  <!-- Firebase SDK (modular, tree-shakeable) -->
  <script type="module" src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
  <script type="module" src="/js/pages/auth.js"></script>
</body>
</html>
